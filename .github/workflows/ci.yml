name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify reference fixture checksums
        run: sha256sum --check --strict tests/parity/fixtures/frappe-v16.51.0/SHA256SUMS

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck, test and build
        run: pnpm exec nx run-many --targets=typecheck,test,build --skipNxCache --outputStyle=static

      - name: Check parity tooling
        run: |
          pnpm exec tsc --project tests/parity/tsconfig.json
          pnpm exec vitest run tests/parity/response.test.ts
